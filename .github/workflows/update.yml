name: Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m masuda_verdict collect
      - name: Judge
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping judge"
            exit 0
          fi
          uv run python -m masuda_verdict judge
      - if: ${{ !cancelled() }}
        run: uv run python -m masuda_verdict aggregate
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/src/data
          git diff --cached --quiet && exit 0
          git commit -m "データ更新"
          git pull --rebase
          git push

      - if: ${{ !cancelled() }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile
        working-directory: site
      - if: ${{ !cancelled() }}
        run: pnpm build
        working-directory: site
      - if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - if: ${{ !cancelled() }}
        id: deploy
        uses: actions/deploy-pages@v4
